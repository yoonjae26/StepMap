<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>StepMap</title>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#14532D"/>
  <!-- paving blocks -->
  <g fill="#86C440">
    <rect x="46" y="150" width="70" height="40" rx="8"/>
    <rect x="124" y="150" width="86" height="40" rx="8"/>
    <rect x="46" y="104" width="44" height="38" rx="8"/>
  </g>
  <!-- the lifted block: the height step StepMap measures -->
  <rect x="98" y="92" width="112" height="40" rx="8" fill="#C7E89A" transform="rotate(-8 154 112)"/>
  <!-- step marker -->
  <path d="M214 196 V150" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <path d="M204 160 L214 148 L224 160" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- grape mark -->
  <g fill="#B7E07A" stroke="#14532D" stroke-width="3">
    <circle cx="62" cy="56" r="13"/><circle cx="88" cy="56" r="13"/><circle cx="75" cy="78" r="13"/>
  </g>
  <path d="M75 42 q6 -14 18 -14" fill="none" stroke="#B7E07A" stroke-width="5" stroke-linecap="round"/>
</svg>
